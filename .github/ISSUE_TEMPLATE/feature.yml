name: Feature
description: Propose a feature or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible after this change?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and explicitly what is left out.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: input
    id: phase
    attributes:
      label: Roadmap phase
      placeholder: "Phase 4 — Home, Projects and Project detail"
