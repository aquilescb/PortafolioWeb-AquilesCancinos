name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Blocking gates are Lighthouse's own measurements — category scores
      # plus LCP/CLS — because they hold regardless of how this static
      # server happens to be configured. The plan's gzip JS/CSS budgets
      # (§5) are NOT asserted here: lhci's local static server may not
      # gzip-compress responses, so a byte-size assertion against it would
      # be measuring the wrong thing. Those budgets are still checked by
      # hand from `npm run build`'s per-file gzip output (plan §16).
      #
      # The static dist dir is set in `lighthouserc.json`'s `collect`
      # section, not here: `treosh/lighthouse-ci-action@v12` has no
      # `staticDistDir` input (it silently ignores unknown inputs), so
      # passing it here was a no-op that left LHCI with no server to hit.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            /es/
            /en/
            /es/proyectos/
            /es/trayectoria/
            /es/sobre-mi/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
